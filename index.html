<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Multiple Integration Studio</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-family='serif' font-size='22' font-weight='bold' fill='white' text-anchor='middle'%3E∬%3C/text%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="wrap">
        <header>
            <div class="header-top">
                <div class="brand-badge">
                    <span class="badge-dot"></span>
                    <span>Calculus Studio</span>
                </div>
                <button type="button" class="theme-btn" id="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle theme">
                    <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2"></path>
                        <path d="M12 20v2"></path>
                        <path d="m4.93 4.93 1.41 1.41"></path>
                        <path d="m17.66 17.66 1.41 1.41"></path>
                        <path d="M2 12h2"></path>
                        <path d="M20 12h2"></path>
                        <path d="m6.34 17.66-1.41 1.41"></path>
                        <path d="m19.07 4.93-1.41 1.41"></path>
                    </svg>
                    <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                    </svg>
                </button>
            </div>
            <div class="header-content">
                <h1>Multiple Integration</h1>
                <p>Interactive region bounds, double &amp; triple integration, and coordinate transformations.</p>
            </div>
            <div class="seg" id="tabs" role="tablist">
                <button type="button" data-v="cart">Double: Cartesian</button>
                <button type="button" data-v="polar">Double: Polar</button>
                <button type="button" data-v="tri">Triple</button>
                <button type="button" data-v="rev">Revolution</button>
                <button type="button" data-v="gr">Graph</button>
            </div>
        </header>
        <section class="panel" aria-label="Controls">
            <div id="ctl"></div>
        </section>
        <div class="sc">
            <div class="stage">
                <canvas id="c" role="img" aria-label="Integration region plot"></canvas>
            </div>
            <div class="panel out" id="out"></div>
        </div>
    </div>
    <div id="kp" hidden aria-label="Math keypad"></div>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>

</html>
